name: Deploy all branches to subfolders

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Deploy to gh-pages branch
        run: |
          # Obtener el nombre de la rama actual
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Deploying branch: $BRANCH_NAME"
          
          # Clonar la rama gh-pages (o crearla si no existe)
          git fetch origin gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          
          # Si la rama gh-pages está vacía, crear estructura inicial
          if [ ! -f "index.html" ]; then
            echo '<!DOCTYPE html>
            <html>
            <head><title>SOFTVENTAS - Versiones</title></head>
            <body>
              <h1>📁 SOFTVENTAS</h1>
              <ul>
                <li><a href="./main/">main</a></li>
                <li><a href="./master/">master</a></li>
                <li><a href="./dev/">dev</a></li>
              </ul>
            </body>
            </html>' > index.html
          fi
          
          # Crear/actualizar la carpeta de la rama actual
          mkdir -p "$BRANCH_NAME"
          
          # Copiar los archivos de la rama actual a su carpeta
          git checkout $BRANCH_NAME -- .
          
          # Mover todo a la carpeta de la rama (excepto .git y carpetas existentes)
          for file in *; do
            if [ "$file" != "$BRANCH_NAME" ] && [ "$file" != ".git" ] && [ "$file" != "index.html" ]; then
              mv "$file" "$BRANCH_NAME/" 2>/dev/null || true
            fi
          done
          
          # Añadir y commit
          git add .
          git commit -m "Deploy branch: $BRANCH_NAME" || echo "No changes to commit"
          git push origin gh-pages
